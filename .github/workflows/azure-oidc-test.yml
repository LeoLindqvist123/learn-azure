name: azure-oidc-test
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  id_token: write
  contents: read
jobs:
  login: 
    runs_on: ubuntu-latest
    steps: 
    - uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTIONS_ID }}
    - run: az group list --output table
